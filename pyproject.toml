[project]
name = "ui-event"
version = "0.2.1"
description = "PyQt6 event camera visualization and EventMamba inference UI."
requires-python = "==3.8.*"
dependencies = [
    "PyQt6==6.7.1",
    "PyQt6-Qt6==6.7.3",
    "PyQt6-sip==13.8.0",
    "pyzmq==27.1.0",
    "numpy==1.24.4",
    "opencv-python==4.13.0.90",
    "h5py==3.11.0",
    "dv-processing==2.0.3",
]

[project.optional-dependencies]
wsl-backend = [
    "torch",
    "timm",
    "mamba-ssm",
]
dev = [
    "pytest==8.3.4",
    "mypy==1.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
