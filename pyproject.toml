[project]
name = "ui-event"
version = "0.2.0"
description = "PyQt6 event camera visualization and EventMamba inference UI."
requires-python = ">=3.8"
dependencies = [
    "PyQt6",
    "pyzmq",
    "numpy",
    "opencv-python",
    "h5py",
]

[project.optional-dependencies]
wsl-backend = [
    "torch",
    "timm",
    "mamba-ssm",
]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
