name: CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests and static checks
    # CPython 3.8 artifacts are not published for the Windows 2025 runner.
    # Keep both jobs on the same supported image so local/CI behavior stays aligned.
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
      UI_EVENT_ALLOW_QT_STUBS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.13.5
        shell: pwsh
        run: |
          $testEnvironment = Join-Path $env:RUNNER_TEMP "test-python"
          $conda = Join-Path $env:CONDA "Scripts\conda.exe"
          & $conda create --yes --prefix $testEnvironment --channel conda-forge python=3.13.5 pip
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $testEnvironment | Add-Content -Path $env:GITHUB_PATH
          (Join-Path $testEnvironment "Scripts") | Add-Content -Path $env:GITHUB_PATH
          & "$testEnvironment\python.exe" --version

      - name: Install CI dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/ci-py313.txt

      - name: Validate test dependency contract and real Qt
        run: |
          python tools/validate_runtime_contract.py --role test
          python tools/validate_source_text.py
          python tools/validate_asset_manifest.py
          python tools/validate_windows_inference_artifacts.py --randla-ellipse artifacts/eventmamba_ellipse_randla_native.onnx --randla-matrix artifacts/eventmamba_ellipse_randla_matrix_A.npy
          python -c "from PyQt6 import QtCore; print('Qt mode: real; PyQt6=' + QtCore.PYQT_VERSION_STR)"

      - name: Run test suite
        shell: pwsh
        run: |
          $output = & python -m pytest -q 2>&1
          $exitCode = $LASTEXITCODE
          $output | Write-Output
          if ($exitCode -ne 0) {
            '### pytest failure output' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            '```text' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            $output | Out-String | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            '```' | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            exit $exitCode
          }

      - name: Run performance regression benchmarks
        run: python tools/benchmark_hot_paths.py --check

      - name: Run type checks
        run: >-
          python -m mypy app backend tools/validate_runtime_contract.py
          --ignore-missing-imports --no-error-summary

      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          foreach ($script in @(
            "scripts/setup_dev.ps1",
            "scripts/check.ps1",
            "scripts/build_installer.ps1",
            "tools/build_selective_scan_ort.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | Format-List
              exit 1
            }
          }

  ui-runtime:
    name: Python 3.8 Metavision smoke
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.8.20
        shell: pwsh
        run: |
          $uiEnvironment = Join-Path $env:RUNNER_TEMP "ui-python"
          $conda = Join-Path $env:CONDA "Scripts\conda.exe"
          & $conda create --yes --prefix $uiEnvironment --channel conda-forge python=3.8.20 pip
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          "UI_PYTHON=$uiEnvironment\python.exe" | Add-Content -Path $env:GITHUB_ENV
          & "$uiEnvironment\python.exe" --version

      - name: Install pinned UI dependencies
        run: '& $env:UI_PYTHON -m pip install --disable-pip-version-check -r requirements/ui-py38.txt'

      - name: Validate UI runtime contract
        run: '& $env:UI_PYTHON tools/validate_runtime_contract.py --role ui --sdk-root libs'

      - name: Import Metavision runtime and initialize processing components
        run: '& $env:UI_PYTHON main.py --runtime-smoke-test'

      - name: Construct and close the real Qt main window
        run: '& $env:UI_PYTHON tools/smoke_ui_window.py --timeout-ms 15000'
